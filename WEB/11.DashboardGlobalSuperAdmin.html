<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Dashboard Usuário</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- POPPINS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  display:flex;
  background: linear-gradient(135deg, #0A0F1C, #0F1A35);
  color:#fff;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  height:100vh; /* CORRIGIDO */
  background: rgba(18,28,58,0.9);
  backdrop-filter: blur(12px);
  padding:20px;
  display:flex;
  position: fixed;
  left: 0;
  top: 0;
  flex-direction:column;
  justify-content:space-between;
  border-right:1px solid rgba(255,255,255,0.05);
}

.sidebar a{
  display:block;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  text-decoration:none;
  color:#B8C2D9;
  transition:0.3s;
}

.sidebar a:hover{
  background: rgba(76,201,240,0.2);
  color:#fff;
}

.logo{
  font-size:18px;
  font-weight:600;
  color:#4CC9F0;
  margin-bottom:20px;
}

.user{
  font-size:14px;
  color:#A9B4D0;
}

/* CONTENT */
.content{
  flex:1;
  padding:30px;
  margin-left:260px; /* ESSENCIAL */
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-bottom:20px;
}

.card{
  background: rgba(18,28,58,0.6);
  backdrop-filter: blur(12px);
  border-radius:16px;
  padding:20px;
}

.card h3{
  font-size:14px;
  color:#A9B4D0;
}

.value{
  font-size:28px;
  color:#4CC9F0;
  font-weight:600;
}

/* STATS */
.stats{
  background: rgba(18,28,58,0.6);
  backdrop-filter: blur(12px);
  color:#4CC9F0;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}

/* ESTACIONAMENTO */
.estacionamento-box{
  background: rgba(18,28,58,0.6);
  backdrop-filter: blur(12px);
  padding:20px;
  border-radius:16px;
}

.estacionamento{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:10px;
}

/* VAGAS */
.vaga{
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:12px;
  font-weight:bold;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.vaga i{
  font-size:14px;
}

/* NEON */
.livre{
  background:#4ade80;
  color:#052e16;
  box-shadow:0 0 12px rgba(74,222,128,0.8);
}

.ocupada{
  background:#f87171;
  color:#450a0a;
  box-shadow:0 0 12px rgba(248,113,113,0.8);
}

.vaga:hover{
  transform:scale(1.08);
}

/* RESPONSIVO */
@media (max-width:768px){
  body{
    flex-direction:column;
  }

  .sidebar{
    position:relative;
    width:100%;
    height:auto;
    flex-direction:row;
    justify-content:space-between;
  }

  .content{
    margin-left:0;
    padding:15px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .estacionamento{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div>
    <div class="logo">
      <i class="fa-solid fa-square-parking"></i> Industrial Park
    </div>

    <a href="19.TelaInicial.html"><i class="fa-solid fa-house"></i> Início</a>
    <a href="05.PerfilUserComum.html"><i class="fa-solid fa-user"></i> Perfil</a>
    <a href="10.LoginSuperAdmin.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    <br>
    <!--nivel do usuario -->
    <div class="user">
      <i class="fa-solid fa-circle-user"></i> SuperAdmin
    </div>
  </div>
</div>

<!-- CONTEÚDO -->
<div class="content">

  <div class="cards">
    <div class="card">
      <h3>Vagas Livres</h3>
      <div class="value" id="livres">0</div>
    </div>

    <div class="card">
      <h3>Vagas Ocupadas</h3>
      <div class="value" id="ocupadas">0</div>
    </div>

    <div class="card">
      <h3>Taxa de Ocupação</h3>
      <div class="value" id="taxa">0%</div>
    </div>
  </div>

  <div class="stats">
    <p><strong>Empresas Cadastradas:</strong> 21</p>
    <p><strong>Usuários Cadastrados:</strong> 87</p>
    <p><strong>Vagas do Sistema:</strong> 32</p>
  </div>

  <div class="estacionamento-box">
    <h3 style="margin-bottom:15px;">Mapa do Estacionamento</h3>
    <div class="estacionamento" id="grid"></div>
  </div>

</div>

<script>
const total = 32;

let vagas = [];
for(let i=0;i<total;i++){
  vagas.push(Math.random() > 0.5 ? 'livre' : 'ocupada');
}

let livres = 0;
let ocupadas = 0;

const grid = document.getElementById("grid");

vagas.forEach((status, i)=>{
  const div = document.createElement("div");
  div.className = `vaga ${status}`;
  div.innerHTML = `<i class="fa-solid fa-car"></i><br>A${(i+1).toString().padStart(2,'0')}`;

  if(status === 'livre') livres++;
  else ocupadas++;

  grid.appendChild(div);
});

document.getElementById("livres").innerText = livres;
document.getElementById("ocupadas").innerText = ocupadas;
document.getElementById("taxa").innerText = Math.round((ocupadas/total)*100) + "%";
</script>

</body>
</html>
